name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validator:
    name: Validate package gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          run-install: false
      - name: Run validator tests
        run: |
          pixi exec \
            --spec 'python=3.14.6' \
            --spec 'zstd=1.5.7' \
            python -m unittest discover -s tests -v
      - name: Audit every published archive
        run: |
          pixi exec --spec 'python=3.14.6' --spec 'zstd=1.5.7' \
            python scripts/validate_channel.py .
      - name: Verify pull requests preserve immutable provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pixi exec --spec 'python=3.14.6' --spec 'zstd=1.5.7' \
            python scripts/validate_channel.py --baseline-ref "$BASE_SHA" .
      - name: Check Python
        run: |
          pixi exec --spec 'ruff=0.12.11' ruff check scripts tests
          pixi exec --spec 'ruff=0.12.11' ruff format --check scripts tests
      - name: Lint workflows
        run: |
          # actionlint 1.7.7 predates GitHub's documented concurrency.queue syntax.
          pixi exec \
            --spec 'actionlint=1.7.7' \
            --spec 'shellcheck=0.10.0' \
            actionlint \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml
          pixi exec \
            --spec 'shellcheck=0.10.0' \
            shellcheck scripts/*.sh
      - name: Test cross-platform solve-only verification
        run: |
          set -euo pipefail
          for subdir in linux-64 linux-aarch64 osx-arm64; do
            artifact="$(find "$subdir" -maxdepth 1 -type f \
              -name 'mojo-shuhafft-*.conda' -print -quit)"
            [[ -n "$artifact" ]]
            scripts/verify_candidate_solve.sh \
              "$artifact" \
              "$subdir" \
              "$GITHUB_WORKSPACE"
          done
