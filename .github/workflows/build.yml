name: Build and propose package publication

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Ecosystem repository to build
        required: true
        type: choice
        options:
          - akari
          - hibana
          - kagerou
          - kumihan
          - moji
          - mojotui
          - nagare
          - nami
          - nerai
          - sen
          - shuhafft
          - yomi
          - yuragi
      ref:
        description: Immutable tag for publication, or a branch/SHA for preflight
        required: true
        default: main
        type: string
      publish:
        description: Propose an immutable channel update for review (requires an annotated version tag)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate source metadata
    runs-on: ubuntu-24.04
    outputs:
      package: ${{ steps.metadata.outputs.package }}
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: channel
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Ameyanagi/${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Verify version, package identity, compiler, and publication ref
        id: metadata
        working-directory: source
        env:
          PUBLISH: ${{ inputs.publish }}
          SELECTED_REF: ${{ inputs.ref }}
          SELECTED_REPOSITORY: ${{ inputs.repository }}
        run: |
          set -euo pipefail

          workspace_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pixi.toml)"
          recipe_version="$(sed -n 's/^  version: "\([^"]*\)"$/\1/p' conda.recipe/recipe.yaml)"
          package_name="$(awk '/^package:/{in_package=1; next} in_package && /^  name:/{print $2; exit}' conda.recipe/recipe.yaml)"
          mojo_requirement="$(sed -n 's/^mojo = "\([^"]*\)"$/\1/p' pixi.toml)"
          source_sha="$(git rev-parse HEAD)"

          [[ "$workspace_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$workspace_version" != "0.0.0" ]]
          [[ "$recipe_version" == "$workspace_version" ]]
          [[ "$mojo_requirement" == "==1.0.0" ]]
          python3 ../channel/scripts/validate_recipe_runtime.py \
            conda.recipe/recipe.yaml \
            --expected-version 1.0.0

          case "${SELECTED_REPOSITORY}:${package_name}" in
            akari:mojo-akari|hibana:mojo-hibana|kagerou:mojo-kagerou|kumihan:mojo-kumihan|moji:mojo-moji|\
            mojotui:mojo-mojotui|nagare:mojo-nagare|nami:mojo-nami|nerai:mojo-nerai|\
            sen:mojo-sen|shuhafft:mojo-shuhafft|yomi:mojo-yomi|yuragi:yuragi) ;;
            *)
              echo "Unexpected repository/package pair: ${SELECTED_REPOSITORY}:${package_name}" >&2
              exit 1
              ;;
          esac

          if [[ "$PUBLISH" == "true" ]]; then
            expected_tag="v${workspace_version}"
            [[ "$SELECTED_REF" == "$expected_tag" ]]
            [[ "$(git cat-file -t "refs/tags/${expected_tag}" 2>/dev/null || true)" == "tag" ]]
            [[ "$(git rev-parse "refs/tags/${expected_tag}^{commit}")" == "$source_sha" ]]
            git merge-base --is-ancestor "$source_sha" refs/remotes/origin/main
          fi

          {
            echo "package=${package_name}"
            echo "sha=${source_sha}"
            echo "version=${workspace_version}"
          } >> "$GITHUB_OUTPUT"
          printf 'Validated %s %s at %s\n' "$package_name" "$workspace_version" "$source_sha"

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-24.04
            subdir: linux-64
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            subdir: linux-aarch64
          - name: macOS ARM64
            os: macos-14
            subdir: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: channel
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: Ameyanagi/${{ inputs.repository }}
          ref: ${{ needs.validate.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          working-directory: source
      - name: Run locked checks and installed-package tests
        working-directory: source
        run: |
          set -euo pipefail
          pixi run --locked check
          pixi run --locked package
      - name: Validate the native artifact
        working-directory: source
        env:
          EXPECTED_PACKAGE: ${{ needs.validate.outputs.package }}
          EXPECTED_SUBDIR: ${{ matrix.subdir }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          artifacts=()
          while IFS= read -r artifact; do
            artifacts+=("$artifact")
          done < <(find "output/${EXPECTED_SUBDIR}" -maxdepth 1 -type f \
            -name "${EXPECTED_PACKAGE}-${EXPECTED_VERSION}-*.conda" -print)
          [[ "${#artifacts[@]}" -eq 1 ]]
          pixi run --locked python3 \
            ../channel/scripts/validate_conda_runtime.py \
            --expected-version 1.0.0 \
            "${artifacts[0]}"
          shasum -a 256 "${artifacts[0]}" | tee "package-${EXPECTED_SUBDIR}.sha256"
      - name: Install exact native candidate in a clean consumer environment
        if: inputs.repository == 'kumihan'
        working-directory: source
        env:
          EXPECTED_SUBDIR: ${{ matrix.subdir }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          artifact="$(find "output/${EXPECTED_SUBDIR}" -maxdepth 1 -type f \
            -name "mojo-kumihan-${EXPECTED_VERSION}-*.conda" -print -quit)"
          if [[ -z "$artifact" ]]; then
            echo "No native Kumihan artifact found for ${EXPECTED_SUBDIR} ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          ../channel/scripts/verify_native_consumer.sh \
            "$artifact" "$EXPECTED_SUBDIR" conda.recipe/test_package.mojo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ inputs.repository }}-${{ matrix.subdir }}
          path: |
            source/output/${{ matrix.subdir }}/*.conda
            source/package-${{ matrix.subdir }}.sha256
          if-no-files-found: error

  publish:
    name: Propose immutable channel update
    if: ${{ inputs.publish }}
    needs:
      - validate
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    concurrency:
      group: mojo-channel-publish
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: incoming
          merge-multiple: true
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.76.2
          run-install: false
      - name: Validate and merge immutable package files
        env:
          EXPECTED_PACKAGE: ${{ needs.validate.outputs.package }}
          EXPECTED_REPOSITORY: ${{ inputs.repository }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          EXPECTED_TAG: ${{ inputs.ref }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          mapfile -t artifacts < <(find incoming -type f -name '*.conda' -print | sort)
          [[ "${#artifacts[@]}" -eq 3 ]]
          pixi exec \
            --spec 'python=3.14.6' \
            --spec 'zstd=1.5.7' \
            python scripts/validate_conda_runtime.py \
            --expected-version 1.0.0 \
            "${artifacts[@]}"
          touch artifacts.tsv
          : > incoming/published.tsv
          declare -A seen_subdirs=()

          for artifact in "${artifacts[@]}"; do
            subdir="$(basename "$(dirname "$artifact")")"
            case "$subdir" in linux-64|linux-aarch64|osx-arm64) ;; *) exit 1 ;; esac
            [[ -z "${seen_subdirs[$subdir]:-}" ]]
            seen_subdirs[$subdir]=1
            filename="$(basename "$artifact")"
            [[ "$filename" == "${EXPECTED_PACKAGE}-${EXPECTED_VERSION}-"*.conda ]]
            destination="${subdir}/${filename}"
            digest="$(sha256sum "$artifact" | awk '{print $1}')"

            if [[ -e "$destination" ]]; then
              cmp --silent "$artifact" "$destination" || {
                echo "Refusing to overwrite ${destination} with different bytes." >&2
                exit 1
              }
            else
              install -m 0644 "$artifact" "$destination"
            fi

            ledger_line="${destination}\t${digest}\t${EXPECTED_REPOSITORY}\t${EXPECTED_TAG}\t${EXPECTED_SHA}"
            grep -Fqx "$ledger_line" artifacts.tsv || printf '%b\n' "$ledger_line" >> artifacts.tsv
            printf '%s\t%s\t%s\n' "$destination" "$subdir" "$digest" >> incoming/published.tsv
          done

          for subdir in linux-64 linux-aarch64 osx-arm64; do
            [[ "${seen_subdirs[$subdir]:-}" == "1" ]]
          done
          sort -u -o artifacts.tsv artifacts.tsv
      - name: Reindex and validate exact repodata entries
        env:
          EXPECTED_PACKAGE: ${{ needs.validate.outputs.package }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          pixi exec --spec 'rattler-index=0.30.11' rattler-index --force fs .
          while IFS=$'\t' read -r destination subdir digest; do
            filename="$(basename "$destination")"
            jq -e \
              --arg filename "$filename" \
              --arg package "$EXPECTED_PACKAGE" \
              --arg version "$EXPECTED_VERSION" \
              --arg subdir "$subdir" \
              --arg digest "$digest" \
              '."packages.conda"[$filename]
                | .name == $package
                  and .version == $version
                  and .subdir == $subdir
                  and .sha256 == $digest' \
              "${subdir}/repodata.json" >/dev/null
          done < incoming/published.tsv
      - name: Audit the complete channel and preserve recorded provenance
        run: |
          pixi exec --spec 'python=3.14.6' --spec 'zstd=1.5.7' \
            python scripts/validate_channel.py --baseline-ref HEAD .
      - name: Solve each exact candidate archive without installation
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r destination subdir _digest; do
            scripts/verify_candidate_solve.sh \
              "$destination" \
              "$subdir" \
              "$GITHUB_WORKSPACE"
          done < incoming/published.tsv
      - name: Commit an immutable release branch and dispatch its checks
        id: proposal
        env:
          EXPECTED_PACKAGE: ${{ needs.validate.outputs.package }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add artifacts.tsv linux-64 linux-aarch64 osx-arm64 noarch
          scripts/propose_release.sh
